name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release

  build-cross:
    name: Build ${{ matrix.target.name }}
    needs: test
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.target }}

      - name: Install cross compile tools (Linux ARM64)
        if: matrix.target.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package library
        shell: bash
        run: |
          mkdir -p artifacts
          find target/${{ matrix.target.target }}/release -maxdepth 1 \( -name "*.rlib" -o -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.a" \) -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wechat-oa-sdk-${{ matrix.target.target }}
          path: artifacts/
          if-no-files-found: warn
