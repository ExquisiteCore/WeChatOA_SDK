[package]
name = "wechat-oa-sdk"
version = "1.0.1"
edition = "2024"
description = "WeChat Official Account API SDK for Rust"
authors = ["ExquisiteCore <xiaolongqq1y@163.com>"]
license = "MIT"
repository = "https://github.com/ExquisiteCore/WeChatOA_SDK"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize", "serde"] }
thiserror = "2"
sha1 = "0.10"
hex = "0.4"
urlencoding = "2.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
